<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Transformamos planilhas em dashboards inteligentes e processos automatizados, sem trocar todo o seu sistema." />
    <title>PulseTech — Sua operação com pulso</title>
    <script>
      (() => {
        let savedTheme;
        try { savedTheme = localStorage.getItem('pulsetech-theme'); } catch {}
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- Formulário invisível: serve só para o Netlify detectar os campos -->
    <form name="contato" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contato" />
      <input name="nome" />
      <input name="email" />
      <textarea name="mensagem"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
