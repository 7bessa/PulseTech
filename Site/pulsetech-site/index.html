<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>PulseTech</title>
  </head>
  <body>
    <!-- Formulário invisível: serve só para o Netlify detectar os campos -->
    <form name="contato" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contato" />
      <input name="nome" />
      <input name="email" />
      <textarea name="mensagem"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
